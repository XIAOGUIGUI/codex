name: Windows custom Codex overlay

on:
  workflow_dispatch:
    inputs:
      patch_revision:
        description: Patch package revision appended to the Codex version
        required: true
        default: "2"
        type: string
      publish_npm:
        description: Publish the generated package to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TARGET: x86_64-pc-windows-msvc
  LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test Windows x64 overlay
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt -- --check

      - uses: ./.github/actions/cache-windows-overlay
        with:
          profile: test

      - name: Test apply-patch
        shell: pwsh
        run: just test -p codex-apply-patch

      - name: Test Windows arg0 dispatch
        shell: pwsh
        run: just test -p codex-arg0

      - name: Test core apply-patch feature wiring
        shell: pwsh
        run: |
          just test -p codex-core inject_apply_patch_env_follows_preserve_line_endings_feature
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          just test -p codex-core file_update_mode_follows_preserve_line_endings_feature
          exit $LASTEXITCODE

      - name: Test compatibility diagnostics
        shell: pwsh
        run: |
          just test -p codex-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          just test -p codex-cli compatibility_diagnostics_cmd
          exit $LASTEXITCODE

  build:
    name: Build Windows x64 overlay
    runs-on: windows-2025
    timeout-minutes: 180
    outputs:
      package_version: ${{ steps.stage_npm.outputs.package_version }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Set up Node.js for npm packaging
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - uses: ./.github/actions/cache-windows-overlay
        with:
          profile: release

      - name: Build release executables
        shell: bash
        run: cargo build --target "$TARGET" --release --timings --bin codex --bin apply_patch

      - name: Run native apply_patch smoke tests
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows-npm-overlay\smoke-test.ps1" `
            -ApplyPatchExe "$env:CARGO_TARGET_DIR\$env:TARGET\release\apply_patch.exe"

      - name: Stage ZIP overlay
        id: stage
        shell: pwsh
        run: |
          $releaseDirectory = "$env:CARGO_TARGET_DIR\$env:TARGET\release"
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object { $_.name -eq "codex-cli" } | Select-Object -First 1).version
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not determine the codex-cli package version."
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $distDirectory = "$env:GITHUB_WORKSPACE\dist\windows-overlay"
          $stageDirectory = Join-Path $distDirectory "codex-windows-x64-overlay"
          New-Item -ItemType Directory -Path $stageDirectory -Force | Out-Null

          Copy-Item "$releaseDirectory\codex.exe" "$stageDirectory\codex.exe"
          Copy-Item "$releaseDirectory\apply_patch.exe" "$stageDirectory\apply_patch.exe"
          Copy-Item "$env:GITHUB_WORKSPACE\scripts\windows-npm-overlay\install.ps1" $stageDirectory
          Copy-Item "$env:GITHUB_WORKSPACE\scripts\windows-npm-overlay\restore.ps1" $stageDirectory
          Copy-Item "$env:GITHUB_WORKSPACE\scripts\windows-npm-overlay\README.md" $stageDirectory

          $buildInfo = [ordered]@{
              version = $version
              target = $env:TARGET
              commit = $env:GITHUB_SHA
              ref = $env:GITHUB_REF
              repository = $env:GITHUB_REPOSITORY
              workflowRunId = $env:GITHUB_RUN_ID
              builtAtUtc = [DateTime]::UtcNow.ToString("o")
          }
          $buildInfo | ConvertTo-Json | Set-Content `
              -LiteralPath "$stageDirectory\build-info.json" -Encoding utf8NoBOM

          $checksumLines = foreach ($fileName in @("codex.exe", "apply_patch.exe")) {
              $hash = (Get-FileHash -LiteralPath "$stageDirectory\$fileName" -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $fileName"
          }
          $checksumLines | Set-Content -LiteralPath "$stageDirectory\SHA256SUMS" -Encoding utf8NoBOM

          $archivePath = Join-Path $distDirectory "codex-windows-x64-overlay-$version-$shortSha.zip"
          Compress-Archive -Path "$stageDirectory\*" -DestinationPath $archivePath -CompressionLevel Optimal
          "archive=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "stage_directory=$stageDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stage npm package
        id: stage_npm
        shell: pwsh
        env:
          PATCH_REVISION: ${{ inputs.patch_revision }}
        run: |
          if ($env:PATCH_REVISION -notmatch '^[1-9][0-9]*$') {
              throw "patch_revision must be a positive integer."
          }

          $upstreamVersion = "${{ steps.stage.outputs.version }}"
          $packageVersion = "$upstreamVersion-patch.$env:PATCH_REVISION"
          $distDirectory = "$env:GITHUB_WORKSPACE\dist\windows-overlay"
          $zipStageDirectory = "${{ steps.stage.outputs.stage_directory }}"
          $npmStageDirectory = Join-Path $distDirectory "npm-package"
          New-Item -ItemType Directory -Path $npmStageDirectory -Force | Out-Null

          foreach ($fileName in @(
              "apply_patch.exe",
              "build-info.json",
              "codex.exe",
              "install.ps1",
              "README.md",
              "restore.ps1",
              "SHA256SUMS"
          )) {
              Copy-Item (Join-Path $zipStageDirectory $fileName) $npmStageDirectory
          }
          Copy-Item "$env:GITHUB_WORKSPACE\LICENSE" $npmStageDirectory
          Copy-Item "$env:GITHUB_WORKSPACE\scripts\windows-npm-overlay\package.json" $npmStageDirectory
          Copy-Item "$env:GITHUB_WORKSPACE\scripts\windows-npm-overlay\bin" $npmStageDirectory -Recurse

          $packageJsonPath = Join-Path $npmStageDirectory "package.json"
          $packageJson = Get-Content -LiteralPath $packageJsonPath -Raw | ConvertFrom-Json
          $packageJson.version = $packageVersion
          $packageJsonText = $packageJson | ConvertTo-Json -Depth 10
          [IO.File]::WriteAllText($packageJsonPath, $packageJsonText, [Text.UTF8Encoding]::new($false))

          Push-Location $npmStageDirectory
          try {
              $dryRun = npm pack --dry-run --json | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $actualFiles = @($dryRun.files.path | Sort-Object)
              $expectedFiles = @(
                  "LICENSE",
                  "README.md",
                  "SHA256SUMS",
                  "apply_patch.exe",
                  "bin/install.js",
                  "bin/powershell.js",
                  "bin/restore.js",
                  "build-info.json",
                  "codex.exe",
                  "install.ps1",
                  "package.json",
                  "restore.ps1"
              ) | Sort-Object
              if (($actualFiles -join "`n") -ne ($expectedFiles -join "`n")) {
                  throw "Unexpected npm package contents.`nExpected:`n$($expectedFiles -join "`n")`nActual:`n$($actualFiles -join "`n")"
              }

              $packResult = npm pack --json --pack-destination $distDirectory | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
              Pop-Location
          }

          $packagePath = Join-Path $distDirectory $packResult.filename
          "package=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Test npm package installation
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows-npm-overlay\npm-smoke-test.ps1" `
            -PackageTarball "${{ steps.stage_npm.outputs.package }}" `
            -CodexExe "$env:CARGO_TARGET_DIR\$env:TARGET\release\codex.exe" `
            -ApplyPatchExe "$env:CARGO_TARGET_DIR\$env:TARGET\release\apply_patch.exe" `
            -UpstreamVersion "${{ steps.stage.outputs.version }}"

      - name: Upload Windows overlay
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-x64-overlay
          path: ${{ steps.stage.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows npm package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-x64-npm-package
          path: ${{ steps.stage_npm.outputs.package }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-windows-custom-build
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Verify and publish Windows npm package
    needs: [test, build]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
    steps:
      - name: Set up Node.js for npm publishing
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download tested npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-windows-x64-npm-package
          path: dist/windows-overlay

      - name: Verify downloaded npm package
        shell: pwsh
        run: |
          $packagePath = "dist/windows-overlay/chenronggui-codex-win-patch-$env:PACKAGE_VERSION.tgz"
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Downloaded npm package was not found at $packagePath."
          }
          $package = Get-Item -LiteralPath $packagePath
          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "npm package: $($package.Name) ($($package.Length) bytes), SHA256 $hash" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Check npm package version availability
        shell: pwsh
        run: |
          $package = "@chenronggui/codex-win-patch@$env:PACKAGE_VERSION"
          $publishedVersion = npm view $package version --json 2>$null
          if ($LASTEXITCODE -eq 0) {
              throw "$package is already published and cannot be overwritten."
          }
          $lookupError = $publishedVersion | ConvertFrom-Json
          if ($lookupError.error.code -ne "E404") {
              throw "Could not check npm version availability: $publishedVersion"
          }
          exit 0

      - name: Publish tested npm package
        if: ${{ inputs.publish_npm }}
        shell: pwsh
        working-directory: dist/windows-overlay
        run: npm publish "./chenronggui-codex-win-patch-$env:PACKAGE_VERSION.tgz" --access public --tag latest
